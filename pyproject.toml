[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fukugan"
version = "0.1.0"
description = "Multi-webcam 3D capture and VR streaming"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Shizuku Tanaka" },
]
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
]

[project.scripts]
fukugan = "fukugan.cli:main"

[tool.setuptools.packages.find]
include = ["fukugan*"]

[tool.setuptools.package-data]
fukugan = ["webui/*.html"]
